# CUPS is reachable only on loopback, never on the LAN. The authenticated app
# administers this dedicated scheduler locally. Do not expose port 631.
Listen 127.0.0.1:631
Browsing Off
WebInterface No
DefaultShared No
LogLevel warn
AccessLog stderr
ErrorLog stderr
PageLog /dev/null
PreserveJobFiles No
PreserveJobHistory Yes
MaxJobs 500
MaxLogSize 1048576
<Location />
  Order deny,allow
  Deny from all
  Allow from 127.0.0.1
</Location>
<Location /admin>
  Order deny,allow
  Deny from all
  Allow from 127.0.0.1
</Location>
<Policy default>
  <Limit All>
    Order deny,allow
    Deny from all
    Allow from 127.0.0.1
  </Limit>
</Policy>
