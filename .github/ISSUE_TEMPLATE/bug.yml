name: Bug report
description: Report a reproducible problem
title: '[Bug] '
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior and actual behavior
      description: Use synthetic documents and remove private data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Revision, OS, browser, Node/Docker version, demo or hardware mode, device model if relevant.
    validations:
      required: true
